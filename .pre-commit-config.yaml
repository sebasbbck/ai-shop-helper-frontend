repos:
-   repo: local
    hooks:
      - id: update-api-client
        name: update api client code
        language: system
        pass_filenames: false
        entry: |
          bash ./pull-openapi.sh
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-json
-   repo: local
    hooks:
      - id: app-prettier
        name: run prettier
        language: system
        files: ^.*$
        types_or: [javascript, json, ts, tsx]
        entry: |
          bash -c 'npm run fix:prettier "${@}"' --

